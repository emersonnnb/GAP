<header>
  <div class="d-flex justify-content-between align-items-center p-3">
    <span><h3>Cadastrar Usuário</h3></span>
    <span class="material-symbols-outlined cursor-pointer" (click)="close()">
      close
    </span>
  </div>
</header>

<main>
  <form [formGroup]="form" class="p-3">
    <div class="row mt-3">
      <div class="col-md-6">
        <mat-form-field floatLabel="always" appearance="outline" class="w-100">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" outline [maxlength]="150" />
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field floatLabel="always" appearance="outline" class="w-100">
          <mat-label>CPF</mat-label>
          <input
            matInput
            formControlName="cpf"
            [maxlength]="150"
            [mask]="cpfMask"
          />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <mat-form-field floatLabel="always" appearance="outline" class="w-100">
          <mat-label>E-mail</mat-label>
          <input matInput formControlName="email" [maxlength]="150" />
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <mat-form-field floatLabel="always" appearance="outline" class="w-100">
          <mat-label>Telefone</mat-label>
          <input
            matInput
            formControlName="telefone"
            [maxlength]="150"
            [mask]="telefoneMask"
          />
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <mat-form-field floatLabel="always" appearance="outline" class="w-100">
          <mat-label>Senha</mat-label>
          <input matInput formControlName="senha" [maxlength]="150" />
        </mat-form-field>
      </div>
      <div class="col-md-6">
        <div class="inline-checkbox">
          <mat-label>Registro:</mat-label>
          <mat-radio-group formControlName="status" libRequiredIndicator>
            <mat-radio-button [value]="statusEnum.ATIVO"
              >Ativo
            </mat-radio-button>
            <mat-radio-button [value]="statusEnum.INATIVO"
              >Inativo</mat-radio-button
            >
          </mat-radio-group>
        </div>
      </div>
    </div>
  </form>

  <div class="p-2 d-flex justify-content-center">
    <button class="w-100 btn-salvar" (click)="save()">Salvar</button>
  </div>
</main>
