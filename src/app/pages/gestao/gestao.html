<lib-custom-tabs
  [title]="'Gestão'"
  [tabs]="tabs"
  defaultActive="usuarios"
  (tabChange)="onTabChange($event)"
></lib-custom-tabs>

<div class="content mt-3">
  @switch (activeTab()) { @case ('usuarios') {
  <app-usuario-list></app-usuario-list>
  } @case ('clientes') {
  <app-cliente-list></app-cliente-list>
  } @case ('fornecedores') { } }
</div>
