<header>
  <div class="d-flex justify-content-between align-items-center p-3">
    <span
      ><h3>{{ mode }} usuário</h3></span
    >
    <span class="material-symbols-outlined cursor-pointer" (click)="close()">
      close
    </span>
  </div>
</header>

<main>
  <form [formGroup]="form" class="p-3">
    <mat-tab-group mat-stretch-tabs="false" [dynamicHeight]="true" mat-align-tabs="start">
      <mat-tab label="Identificação" isActive="true" >
        <div class="row mt-4">
          <div class="col-md-4">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>Nome</mat-label>
              <input
                matInput
                formControlName="nome"
                outline
                [maxlength]="150"
              />
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>CPF</mat-label>
              <input
                matInput
                formControlName="cpf"
                [maxlength]="150"
                [mask]="cpfMask"
              />
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>Data de nascimento</mat-label>
              <input
                matInput
                formControlName="dtNascimento"
                [maxlength]="150"
                [mask]="cpfMask"
              />
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-md-4">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>E-mail</mat-label>
              <input matInput formControlName="email" [maxlength]="150" />
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>Telefone</mat-label>
              <input
                matInput
                formControlName="telefone"
                [maxlength]="150"
                [mask]="telefoneMask"
              />
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <div class="inline-checkbox">
              <mat-label>Registro:</mat-label>
              <mat-radio-group formControlName="status" libRequiredIndicator>
                <mat-radio-button [value]="statusEnum.ATIVO"
                  >Ativo
                </mat-radio-button>
                <mat-radio-button [value]="statusEnum.INATIVO"
                  >Inativo</mat-radio-button
                >
              </mat-radio-group>
            </div>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>

    <mat-tab-group mat-stretch-tabs="false" [dynamicHeight]="true" mat-align-tabs="start">
      <mat-tab label="Endereço" isActive="true">
        <div class="row mt-3">
          <div class="col-md-3">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>Cep</mat-label>
              <input
                matInput
                formControlName="cep"
                [maxlength]="150"
                [mask]="cepMask"
              />
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>Logradouro</mat-label>
              <input
                matInput
                formControlName="logradouro"
                [maxlength]="150"
                
              />
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>Bairro</mat-label>
              <input
                matInput
                formControlName="bairro"
                [maxlength]="150"
                
              />
            </mat-form-field>
          </div>
        </div>
        <div class="row">
          <div class="col-md-3">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>Cidade</mat-label>
              <input
                matInput
                formControlName="cidade"
                [maxlength]="150"                
              />
            </mat-form-field>
          </div>
          <div class="col-md-4">
            <mat-form-field
              floatLabel="always"
              appearance="outline"
              class="w-100"
            >
              <mat-label>Estado</mat-label>
              <input matInput formControlName="uf" [maxlength]="150" />
            </mat-form-field>
          </div>
        </div>
      </mat-tab>
    </mat-tab-group>
  </form>

  @if (mode !== formModeEnum.VISUALIZAR) {
  <div class="p-2 d-flex justify-content-center gap-2">
    <button class="w-100 btn btn-salvar mr-3" (click)="save()" [disabled]="form.invalid">Salvar</button>
    <button class="w-100 btn btn-secondary" (click)="close()">Cancelar</button>
  </div>
  }
</main>
