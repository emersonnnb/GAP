<div class="app-container">
  <div class="sidebar" [class.collapsed]="sidebarCollapsed()">
    <div class="logo">
      <img src="assets/images/icon_GAP.png" alt="Logo" />
      <span class="collapse-icon material-symbols-outlined" (click)="toggleSidebar()">
        chevron_left
      </span>
    </div>

    <div class="menu">
      @for (item of menuItems; track item.link) {
        <div
          class="menu-item"
          [class.active]="selectedMenu() === item.link"
          (click)="selectMenu(item.link)"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          @if (!sidebarCollapsed()) {
            <span class="label">{{ item.label }}</span>
          }
        </div>
      }
    </div>
  </div>

  <div class="main">
    <div class="navbar">
      <div>
        <h1>Ola, Admin!</h1>
        <h5>Organize, otimize e avance com agilidade.</h5>
      </div>

      <div class="profile">
        <div class="profile-item">
          <span class="material-symbols-outlined"> account_circle </span>
          <span>Perfil</span>
        </div>
        <div class="profile-item">
          <span class="material-symbols-outlined"> logout </span>
          <span>Sair</span>
        </div>
      </div>
    </div>

    <div class="content">
      <router-outlet />
    </div>
  </div>
</div>
